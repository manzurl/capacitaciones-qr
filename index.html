<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capacitaciones</title>

<style>

body{
font-family: 'Segoe UI', Arial, sans-serif;
max-width: 900px;
margin: auto;
padding: 20px;
background: #f4f6f9;
color: #333;
}

h1{
text-align:center;
color:#003366;
margin-bottom:30px;
}

.empleado{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
margin-bottom:20px;
}

.card{
border-radius:12px;
padding:18px;
margin-bottom:15px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.vigente{
background:#d4edda;
border-left:8px solid #28a745;
}

.proximo{
background:#fff3cd;
border-left:8px solid #ffc107;
}

.vencido{
background:#f8d7da;
border-left:8px solid #dc3545;
}

.error{
background:#f8d7da;
}

.estado{
font-size:18px;
font-weight:bold;
margin-top:10px;
}

/* RESPONSIVE PARA CELULAR */

@media (max-width: 600px){

    body{
        padding:10px;
    }

    h1{
        font-size:28px;
    }

    .empleado{
        padding:15px;
    }

    .card{
        padding:15px;
    }

}

</style>

</head>
<body>

<h1>Capacitaciones</h1>

<div id="resultado"></div>

<script>

const legajo =
new URLSearchParams(window.location.search)
.get("legajo");


function excelDateToJSDate(serial){

    const utc_days = serial - 25569;
    const utc_value = utc_days * 86400;

    const date = new Date(utc_value * 1000);

    return date.toLocaleDateString('es-AR');
}


function diasRestantes(serial){

const utc_days = serial - 25569;
const utc_value = utc_days * 86400;

const fecha = new Date(utc_value * 1000);

const hoy = new Date();

return Math.ceil(
    (fecha - hoy) / (1000 * 60 * 60 * 24)
);

}

function obtenerEstado(serial){

const dias = diasRestantes(serial);

if(dias < 0){
    return {
        clase:"vencido",
        texto:"🔴 Vencido"
    };
}

if(dias <= 30){
    return {
        clase:"proximo",
        texto:"🟡 Próximo a vencer"
    };
}

return {
    clase:"vigente",
    texto:"🟢 Vigente"
};

}

async function cargar(){

  if(!legajo){

        document.getElementById("resultado").innerHTML = `
            <div class="card">
                <h2>Error</h2>
                <p>No se especificó ningún legajo.</p>
            </div>
        `;

        return;
    }

    const respuesta = await fetch(
        "https://defaultc0a6e65377dc41a6a0448f12d4ad64.1d.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/74804848daf940c79fe30dada4878a86/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=C-P_t8mcqr-vTeOBLppGeqCD9Eii1hIyAyNxs53iTj4",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                legajo:legajo
            })
        }
    );

    const datos = await respuesta.json();

    let html = "";

if(datos.length === 0){

    document.getElementById("resultado").innerHTML = `
        <div class="card">
            <h2>Legajo no encontrado</h2>
            <p>No existen capacitaciones para el legajo ${legajo}.</p>
        </div>
    `;

    return;
}

html += `
<h2>${datos[0].Nombre}</h2>
<h3>Legajo ${datos[0].Legajo}</h3>
`;

html += `
<div class="empleado">
    <h2>${datos[0].Nombre}</h2>
    <p><strong>Legajo:</strong> ${datos[0].Legajo}</p>
    <p><strong>Capacitaciones:</strong> ${datos.length}</p>
</div>
`;

datos.forEach(item => {

    const estado =
        obtenerEstado(item.FechaVencimiento);

    html += `
        <div class="card ${estado.clase}">

            <h3>${item.Capacitacion}</h3>

            <p>
                <strong>Realizado:</strong>
                ${excelDateToJSDate(item.FechaRealizacion)}
            </p>

            <p>
                <strong>Vence:</strong>
                ${excelDateToJSDate(item.FechaVencimiento)}
            </p>

            <div class="estado">
                ${estado.texto}
            </div>

        </div>
    `;

});

    document.getElementById("resultado")
    .innerHTML = html;

}

cargar();

</script>

</body>
</html>
