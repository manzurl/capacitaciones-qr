<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capacitaciones</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>

  <body>
    <header class="header">
      <img
        src="img/simplot-vector-logo.png"
        alt="Grupo Fecovita"
        class="logo"
      />

      <div class="header-info">
        <h1 class="titulo">Portal de Competencias y Capacitación</h1>

        <p class="subtitulo">Seguridad y salud ocupacional - Mendoza</p>
      </div>
    </header>
    <div class="buscador-container">
      <input
        type="text"
        id="filtroCapacitaciones"
        placeholder="🔍 Buscar capacitación..."
        class="buscador"
      />

      <div class="filtros-estado">
        <button class="btn-filtro activo" data-filtro="todas">Todas</button>

        <button class="btn-filtro" data-filtro="vigente">🟢 Vigentes</button>

        <button class="btn-filtro" data-filtro="proximo">🟡 Por vencer</button>

        <button class="btn-filtro" data-filtro="vencido">🔴 Vencidas</button>
      </div>

      <div id="contadorResultados" class="contador-resultados">
        Mostrando 0 resultados
      </div>
    </div>

    <div id="resultado"></div>

    <script src="js/app.js"></script>
  </body>
</html>
